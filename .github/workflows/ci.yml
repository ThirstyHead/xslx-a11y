name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies for headless Qt
        run: |
          sudo rm -f /etc/apt/sources.list.d/google*.list || true
          sudo apt-get update -o Acquire::Retries=3 || true
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
      - name: Run test suite with coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ --cov=xslx_a11y -q
      - name: Smoke CLI
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p /tmp/smoke
          xslx-a11y examples/Financial-Summary.xlsx --format md,html,pdf,json --output-dir /tmp/smoke
          test -f /tmp/smoke/Financial-Summary-a11y-report.md
          test -f /tmp/smoke/Financial-Summary-a11y-report.html
          test -f /tmp/smoke/Financial-Summary-a11y-report.pdf
          test -f /tmp/smoke/Financial-Summary-audit.json
          xslx-a11y examples/Financial-Summary-test.xlsx --fix --out-xlsx /tmp/smoke/remediated.xlsx --format md,html,pdf,json --output-dir /tmp/smoke || true
          test -f /tmp/smoke/remediated.xlsx
          test -f /tmp/smoke/Financial-Summary-test-a11y-report.pdf
