[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xlsx-a11y"
version = "0.1.0"
description = "Audit and remediate Microsoft Excel .xlsx workbooks against WCAG 2.1 AA (headless, deterministic)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xlsx-a11y contributors" }]
keywords = ["accessibility", "wcag", "excel", "xlsx", "ooxml", "audit", "remediation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]
dependencies = [
    "engine-a11y @ git+https://github.com/ThirstyHead/engine-a11y.git@v0.4.0",
    "openpyxl>=3.1.2,<4",
    "wcag-contrast-ratio>=0.9,<1",
    "markdown>=3.6,<4",
    "pymupdf>=1.24",
    "pikepdf>=9.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.5",
]
dev = [
    "PySide6>=6.5",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-qt>=4.4.0",
]
all = [
    "xlsx-a11y[dev,gui]",
]

[project.scripts]
xlsx-a11y = "xlsx_a11y.cli:main"
xlsx-a11y-gui = "xlsx_a11y.gui.app:main"

[project.urls]
Homepage = "https://github.com/ThirstyHead/xlsx-a11y"
Repository = "https://github.com/ThirstyHead/xlsx-a11y.git"
Issues = "https://github.com/ThirstyHead/xlsx-a11y/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xlsx_a11y = [
    "sc_cache.json",
    "reports/themes/**/*.css",
    "reports/themes/**/*.json",
    "reports/themes/**/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
